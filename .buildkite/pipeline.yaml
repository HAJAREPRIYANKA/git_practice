steps:
  - label: ":building_construction: Backend application for be.dev"
    agents:
      queue: dev
      type: build
    command:
      - bash -x .buildkite/build.sh
    branches: "dev"
    key: "build-step"

  - label: ":rocket: Trigger Deployment Pipeline"
    trigger: "node-app-dev-deploy"
    branches: "dev"
    async: false
    depends_on: "build-step"
